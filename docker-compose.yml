services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dem-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [dem-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dem-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [dem-net]

  postgres:
    image: postgres:16
    container_name: dem-postgres
    environment:
      POSTGRES_USER: decisions
      POSTGRES_PASSWORD: decisions
      POSTGRES_DB: decisions
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks: [dem-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisions"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    container_name: dem-ml
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/models
      DATA_DIR: /app/data
      DRIFT_PSI_THRESHOLD: "0.25"
      DRIFT_CHECK_INTERVAL_SECONDS: "300"
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/data:/app/data
    networks: [dem-net]

  orchestrator:
    build: ./orchestrator
    container_name: dem-orchestrator
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/decisions
      SPRING_DATASOURCE_USERNAME: decisions
      SPRING_DATASOURCE_PASSWORD: decisions
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ML_SERVICE_URL: http://ml-service:8000
    networks: [dem-net]

  dashboard:
    build: ./dashboard
    container_name: dem-dashboard
    ports:
      - "4200:80"
    depends_on: [orchestrator]
    networks: [dem-net]

  simulator:
    build: ./simulator
    container_name: dem-simulator
    depends_on: [kafka]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      EVENTS_PER_SECOND: "5"
    networks: [dem-net]
    profiles: ["simulate"]

networks:
  dem-net:
    driver: bridge
